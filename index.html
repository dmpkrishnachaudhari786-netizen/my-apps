<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Apps</title>
<meta name="description" content="Turn any website into an app icon — add sites, open them full-screen, install it.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0b1020;--panel:rgba(30,41,59,.72);--border:rgba(148,163,184,.18);--accent:#38bdf8;--text:#e8eefb;--muted:#94a3b8;--radius:16px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 700px at 15% -10%,#16233f 0%,var(--bg) 55%) fixed,var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding:20px 16px 90px}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:1.5rem;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 5px}
  input{width:100%;background:#0b1220;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:1rem}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:10px;margin-top:14px}
  button{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:.95rem;padding:12px 14px}
  .primary{background:var(--accent);color:#04121f;flex:1}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .err{color:#fca5a5;font-size:.82rem;min-height:1.2em;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}
  .app{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;color:var(--text);padding:4px}
  .app .ic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;font-weight:700;color:#04121f;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .app .nm{font-size:.8rem;color:var(--text);max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .empty{text-align:center;color:var(--muted);font-size:.9rem;padding:18px 6px}
  .empty b{color:var(--text);display:block;margin-bottom:4px}
  /* viewer */
  .viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
  .viewer.show{display:flex}
  .vbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:#0b1220}
  .vbar .t{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbar button{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 12px;font-size:.85rem}
  iframe{flex:1;width:100%;border:0;background:#fff}
  .blocked{padding:30px 20px;text-align:center;color:var(--muted)}
  .blocked b{color:var(--text);display:block;margin-bottom:8px;font-size:1.05rem}
  .blocked .primary{max-width:280px;margin:16px auto 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#0b1220;border:1px solid var(--border);
    color:var(--text);padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">My Apps</div></header>
  <h1>Any website, as an app</h1>

  <section class="card">
    <label for="nameInput">App name</label>
    <input id="nameInput" type="text" placeholder="YouTube" maxlength="30">
    <label for="urlInput">Website URL</label>
    <input id="urlInput" type="url" placeholder="https://m.youtube.com" inputmode="url">
    <div class="err" id="formErr" role="alert" aria-live="polite"></div>
    <div class="row"><button class="primary" id="addBtn" type="button">Add app</button></div>
  </section>

  <section class="card">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><b>No apps yet</b>Add a website above — it becomes an app icon.</div>
  </section>
</div>

<div class="viewer" id="viewer">
  <div class="vbar">
    <button id="backBtn" type="button">← Back</button>
    <div class="t" id="vName">App</div>
    <button id="openBtn" type="button">Open in browser</button>
  </div>
  <div id="frameBox" style="flex:1;display:flex"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const STORE="myApps.v1";
const $=id=>document.getElementById(id);
const COLORS=["#38bdf8","#22c55e","#f59e0b","#ef4444","#a78bfa","#ec4899","#14b8a6","#f97316"];
let apps=[];

function load(){ try{ const d=JSON.parse(localStorage.getItem(STORE)||"[]"); if(Array.isArray(d)) apps=d; }catch(e){} }
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(apps)); }catch(e){ toast("Could not save"); } }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normUrl(u){ u=u.trim(); if(!/^https?:\/\//i.test(u)) u="https://"+u; return u; }
function validHost(u){ const h=u.trim().replace(/^https?:\/\//i,"").split("/")[0]; return /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(h); }
function initial(n){ return (n.trim()[0]||"?").toUpperCase(); }

function render(){
  const g=$("grid"); g.innerHTML="";
  $("empty").hidden = apps.length>0;
  apps.forEach((a,i)=>{
    const b=document.createElement("button");
    b.className="app"; b.type="button"; b.dataset.i=i;
    b.innerHTML='<span class="ic" style="background:'+a.color+'">'+esc(initial(a.name))+'</span>'+
                '<span class="nm">'+esc(a.name)+'</span>';
    b.addEventListener("click",()=>openApp(i));
    b.addEventListener("contextmenu",e=>{e.preventDefault();delApp(i);});
    g.appendChild(b);
  });
}
function openApp(i){
  const a=apps[i];
  $("vName").textContent=a.name;
  $("openBtn").onclick=()=>window.open(a.url,"_blank","noopener");
  const box=$("frameBox"); box.innerHTML="";
  const ifr=document.createElement("iframe");
  ifr.setAttribute("title",a.name); ifr.setAttribute("referrerpolicy","no-referrer");
  ifr.src=a.url;
  // If the site refuses to be embedded, show a helpful message instead of a blank frame.
  let loaded=false; ifr.addEventListener("load",()=>{loaded=true;});
  box.appendChild(ifr);
  setTimeout(()=>{
    if(!loaded){
      box.innerHTML='<div class="blocked"><b>This site does not allow being shown inside an app</b>'+
        esc(a.url.split("/")[2]||a.url)+' blocks embedding (for security). Tap below to open it in your browser.'+
        '<div><button class="primary" id="ob2" type="button">Open '+esc(a.name)+' in browser</button></div></div>';
      const ob=$("ob2"); if(ob) ob.onclick=()=>window.open(a.url,"_blank","noopener");
    }
  },2500);
  $("viewer").classList.add("show");
}
function delApp(i){
  if(!confirm("Remove “"+apps[i].name+"”?")) return;
  apps.splice(i,1); save(); render(); toast("Removed");
}
function addApp(){
  const name=$("nameInput").value.trim();
  let url=$("urlInput").value.trim();
  if(!name){ $("formErr").textContent="Please enter a name."; return; }
  if(!url || !validHost(url)){ $("formErr").textContent="Please enter a valid website URL."; return; }
  url=normUrl(url);
  if(apps.some(a=>a.url===url)){ $("formErr").textContent="That website is already added."; return; }
  apps.push({name,url,color:COLORS[apps.length%COLORS.length]});
  save(); render(); $("nameInput").value=""; $("urlInput").value=""; $("formErr").textContent="";
  toast("Added "+name);
}

$("addBtn").addEventListener("click",addApp);
$("backBtn").addEventListener("click",()=>{ $("viewer").classList.remove("show"); $("frameBox").innerHTML=""; });
$("urlInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addApp(); });

load();
// seed with YouTube + a couple of examples on first run
if(!apps.length){
  apps=[
    {name:"YouTube",url:"https://m.youtube.com",color:COLORS[3]},
    {name:"Wikipedia",url:"https://en.wikipedia.org",color:COLORS[6]},
    {name:"Smart Alarm",url:"https://dmpkrishnachaudhari786-netizen.github.io/smart-alarm/",color:COLORS[0]}
  ];
  save();
}
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
